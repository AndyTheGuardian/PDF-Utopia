document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if (pick) { toggleAccentPopup(undefined, pick.dataset.pick, pick); return; }
  if (!e.target.closest("[data-act=accent]")) toggleAccentPopup(false);
  const menuBtn = e.target.closest(".menu > button");
  document.querySelectorAll(".menu.open").forEach(m => { if (!menuBtn || m !== menuBtn.parentElement) m.classList.remove("open"); });
  if (menuBtn) { menuBtn.parentElement.classList.toggle("open"); return; }

  const act = e.target.closest("[data-act]");
  if (act) { ACTIONS[act.dataset.act]?.(); return; }

  const themeOpt = e.target.closest("[data-theme-opt]");
  if (themeOpt) { state.theme = themeOpt.dataset.themeOpt; applyTheme(); return; }
  const langOpt = e.target.closest("[data-lang-opt]");
  if (langOpt) { state.lang = langOpt.dataset.langOpt; render(); return; }

  const toolBtn = e.target.closest("[data-tool]");
  if (toolBtn) {
    state.tool = toolBtn.dataset.tool;
    document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("active", b === toolBtn));
    renderPage(); renderOptions();
    if (state.tool === "signature" && !state.signatures.length) openSignDialog();
    return;
  }
  const sw = e.target.closest("[data-color]");
  if (sw) { state.colors[state.tool] = sw.dataset.color; renderOptions(); return; }

  const sigChip = e.target.closest("[data-sig]");
  if (sigChip) { state.selectedSignature = +sigChip.dataset.sig; renderOptions(); return; }
  const slotDel = e.target.closest("[data-slot-del]");
  if (slotDel) {
    const i = +slotDel.dataset.slotDel;
    state.signatures.splice(i, 1);
    state.selectedSignature = Math.max(0, Math.min(state.selectedSignature, state.signatures.length - 1));
    loadSlot(Math.min(sign.slot, state.signatures.length)); renderSignDialog(); renderOptions(); return;
  }
  const slot = e.target.closest("[data-slot]");
  if (slot) {
    const i = +slot.dataset.slot;
    if (i > state.signatures.length) { toast(t("signEmpty")); return; }
    loadSlot(i); renderSignDialog(); return;
  }
  const signColor = e.target.closest("[data-sign-color]");
  if (signColor) { sign.color = signColor.dataset.signColor; renderSignDialog(); return; }
  if (e.target.id === "signClear") { sign.strokes = []; drawPad(); return; }
  if (e.target.id === "signSave") { saveSignature(); return; }
  const sideTab = e.target.closest("[data-side]");
  if (sideTab) {
    document.querySelectorAll("[data-side]").forEach(b => b.classList.toggle("on", b === sideTab));
    $("#thumbs").hidden = sideTab.dataset.side !== "pages";
    $("#annPanel").hidden = sideTab.dataset.side !== "ann";
    return;
  }
  const annItem = e.target.closest(".ann-item");
  if (annItem) { jumpTo($("#annList")._entries[+annItem.dataset.ann], annItem.dataset.key); return; }
  const srcPage = e.target.closest("[data-src-page]");
  if (srcPage) {
    const set = new Set(mergeSelection().pages), n = +srcPage.dataset.srcPage;
    set.has(n) ? set.delete(n) : set.add(n);
    const sorted = [...set].sort((a, b) => a - b);
    $("#mergeInput").value = sorted.length === merge.source.pages ? "" : sorted.length ? compressPages(sorted) : "0";
    renderMerge(); return;
  }
  const thumbAct = e.target.closest("[data-thumb-act]");
  if (thumbAct) {
    const idx = +thumbAct.closest(".thumb").dataset.idx;
    thumbAct.dataset.thumbAct === "rotate" ? rotatePage(idx) : deletePage(idx);
    return;
  }
  const thumb = e.target.closest(".thumb");
  if (thumb) { state.current = +thumb.dataset.idx; render(); return; }

  // Fußnotenzahl wird beim Darüberfahren zum ×: Klick entfernt den Kommentar (rückgängig machbar)
  const badge = e.target.closest(".page-body p .badge");
  if (badge) {
    const list = annOf(currentPage().id).comments;
    const index = list.findIndex(c => c.para === +badge.closest("p").dataset.para);
    const removed = list[index];
    execute({ do: () => list.splice(index, 1), undo: () => list.splice(index, 0, removed) });
    return;
  }

  const para = e.target.closest(".page-body p");
  if (para && state.tool === "comment" && !para.classList.contains("commented")) {
    const list = annOf(currentPage().id).comments;
    const c = { para: +para.dataset.para, color: state.colors.comment, text: null };
    execute({ do: () => list.push(c), undo: () => list.splice(list.indexOf(c), 1) });
  }
  if (e.target.matches("[data-close]")) e.target.closest("dialog").close();
});

document.addEventListener("input", e => {
  if (e.target.id === "width") { state.widths[state.tool] = +e.target.value; renderOptions(); $("#width").focus(); }
  if (e.target.id === "smoothing") { state.smoothing = +e.target.value; renderOptions(); $("#smoothing").focus(); }
  if (e.target.id === "eraserSize") { state.eraserSize = +e.target.value; renderOptions(); $("#eraserSize").focus(); }
  if (e.target.id === "extractInput") renderExtract();
  if (e.target.id === "mergeInput" || e.target.id === "mergePosPage") renderMerge();
  if (e.target.id === "setUndo") state.undoLimit = Math.max(1, Math.min(500, +e.target.value || 1)), renderStatus();
  if (e.target.id === "search") $("#hits").textContent = e.target.value ? t("hits", { n: e.target.value.length > 2 ? 7 : 23 }) : "";
  if (e.target.matches(".fn .t")) { annOf(currentPage().id).comments[+e.target.dataset.c].text = e.target.textContent; renderAnnotations(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "setTheme") { state.theme = e.target.value; applyTheme(); }
  if (e.target.id === "pressure") state.pressure = e.target.checked;
  if (e.target.id === "setLang") { state.lang = e.target.value; render(); }
  if (e.target.id === "mergeSource") {
    if (e.target.value === "choose") { toast("Mockup: Dateiauswahl des Systems"); e.target.value = merge.source.key; return; }
    merge.source = MERGE_SOURCES.find(s => s.key === e.target.value); merge.unlocked = false;
    $("#mergeInput").value = ""; renderMerge();
  }
  if (e.target.id === "mergePos") renderMerge();
  if (e.target.id === "annFilter") renderAnnotations();
  if (e.target.id === "signPressure") { sign.pressure = e.target.checked; drawPad(); }
});
$("#mergeGo").onclick = runMerge;
$("#mergePwd").addEventListener("keydown", e => { if (e.key === "Enter") runMerge(); });
$("#extractGo").onclick = () => { const n = renderExtract().length; $("#dlgExtract").close(); toast(t("toastExtract", { n })); };

// Drag & Drop in der Seitenliste
let dragFrom = null;
const thumbs = $("#thumbs");
thumbs.addEventListener("dragstart", e => {
  const th = e.target.closest(".thumb"); dragFrom = +th.dataset.idx;
  th.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
});
const isFileDrag = e => dragFrom === null && [...e.dataTransfer.types].includes("Files");
thumbs.addEventListener("dragover", e => {
  if (isFileDrag(e)) { thumbs.classList.add("file-over"); thumbs.title = t("dropHint"); }
  const th = e.target.closest(".thumb"); if (!th) { if (isFileDrag(e)) e.preventDefault(); return; }
  e.preventDefault();
  thumbs.querySelectorAll(".drop-before,.drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
  const r = th.getBoundingClientRect();
  th.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after");
});
thumbs.addEventListener("dragleave", e => { if (!thumbs.contains(e.relatedTarget)) thumbs.classList.remove("file-over"); });
thumbs.addEventListener("drop", e => {
  e.preventDefault();
  if (isFileDrag(e)) {
    // PDF aus dem Dateimanager: Dialog mit der Datei und der Ablageposition öffnen
    thumbs.classList.remove("file-over");
    const th = e.target.closest(".thumb");
    const afterIndex = th ? +th.dataset.idx + (th.classList.contains("drop-after") ? 1 : 0) : state.pages.length;
    thumbs.querySelectorAll(".drop-before,.drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
    const file = e.dataTransfer.files[0];
    if (file && /\.pdf$/i.test(file.name)) openMerge({ file: file.name, afterIndex });
    return;
  }
  const th = e.target.closest(".thumb"); if (!th || dragFrom === null) return;
  let to = +th.dataset.idx + (th.classList.contains("drop-after") ? 1 : 0);
  if (to > dragFrom) to--;
  movePage(dragFrom, to); dragFrom = null;
});
thumbs.addEventListener("dragend", () => { dragFrom = null; renderThumbs(); });

document.addEventListener("keydown", e => {
  if (e.target.isContentEditable || e.target.matches("input")) return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey && k === "z") { e.preventDefault(); undo(); }
  else if (e.ctrlKey && k === "y") { e.preventDefault(); redo(); }
  else if (e.ctrlKey && k === "e") { e.preventDefault(); ACTIONS.extract(); }
  else if (e.ctrlKey && k === "i") { e.preventDefault(); ACTIONS.merge(); }
  else if (e.ctrlKey && k === "f") { e.preventDefault(); ACTIONS.find(); }
  else if (k === "delete") deletePage(state.current);
  else if (k === "arrowdown" || k === "arrowup") { state.current = Math.max(0, Math.min(state.pages.length - 1, state.current + (k === "arrowdown" ? 1 : -1))); render(); }
});

bindSignPad();
render();
setAccent(accent.hex);   // gespeicherte Akzentfarbe anwenden
</script>
</body>
</html>
